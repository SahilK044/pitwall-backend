name: Race weekend keep-alive

# Render's free instance sleeps after 15 minutes without a request, which drops the F1 live
# timing connection until the next fan wakes it (30-60 s cold start). On race weekends
# (Friday to Sunday, UTC) this pings /health every 10 minutes so the feed stays connected.
on:
  schedule:
    - cron: '*/10 * * * 5,6,0'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 120 --retry 2 --retry-delay 20 \
            https://pitwall-backend-rj02.onrender.com/health -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"

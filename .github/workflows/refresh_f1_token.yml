name: Refresh F1TV Token

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 */2 * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  refresh-token:
    name: Auto Refresh Token
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Token Refresh
        env:
          F1_EMAIL: ${{ secrets.F1_EMAIL }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
          F1_STORAGE_STATE: ${{ secrets.F1_STORAGE_STATE }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://pitwall-backend-rj02.onrender.com' }}
        run: |
          python scripts/refresh_token.py

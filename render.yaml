services:
  - type: web
    name: pitwall-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PREDICTIONS_ENABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: PITWALL_ADMIN_KEY
        sync: false
      - key: F1TV_TOKEN
        sync: false

